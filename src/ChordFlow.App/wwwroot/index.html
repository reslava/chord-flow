<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChordFlow</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e6e6e6;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      padding: .6rem 1rem;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    #status { font-size: .8rem; color: #9aa0a6; margin-left: auto; }
    /* Transport bar — minimal play/stop/tempo controls for playback (step 4). */
    #transport {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .5rem 1rem;
      background: #2d2d30;
      border-bottom: 1px solid #333;
      font-size: .85rem;
    }
    #transport button {
      font: inherit;
      padding: .3rem .9rem;
      border: 1px solid #4a4a4f;
      border-radius: 4px;
      background: #3a3a3d;
      color: #e6e6e6;
      cursor: pointer;
    }
    #transport button:disabled { opacity: .5; cursor: default; }
    #transport label { color: #9aa0a6; }
    #tempo { width: 4rem; font: inherit; padding: .25rem .4rem; }
    main { padding: 1rem; }
    /* alphaTab renders its tablature into this element. position:relative anchors
       the absolutely-positioned cursor overlay. */
    #score { position: relative; background: #fff; color: #000; border-radius: 6px; overflow: auto; }
    /* alphaTab positions the playback cursor + highlight elements but does NOT
       color them — we must, per the alphaTab cursor docs, or they're invisible. */
    .at-cursor-bar { background: rgba(255, 242, 0, 0.25); }      /* current bar highlight */
    .at-cursor-beat { background: rgba(64, 64, 255, 0.75); width: 3px; } /* moving beat line */
    .at-highlight * { fill: #2867f5; stroke: #2867f5; }          /* active beat's notes */
  </style>
</head>
<body>
  <header>
    <h1>ChordFlow</h1>
    <span>Rhythm &amp; Progression Trainer</span>
    <span id="status">starting…</span>
  </header>
  <section id="transport">
    <button id="btnPlay" type="button" disabled>▶ Play</button>
    <button id="btnStop" type="button" disabled>■ Stop</button>
    <label for="tempo">Tempo</label>
    <input id="tempo" type="number" min="40" max="240" step="1" value="80" disabled />
    <span>BPM</span>
  </section>
  <main>
    <div id="score"></div>
  </main>

  <!-- Bundled alphaTab JS build (constraint C6) — loaded from disk, offline. -->
  <script src="alphaTab.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
