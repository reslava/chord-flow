<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChordFlow</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e6e6e6;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      padding: .6rem 1rem;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    #status { font-size: .8rem; color: #9aa0a6; margin-left: auto; }

    /* Toolbars — the builder (key/rhythm/generate/save/practiced) and the transport
       (play/stop/tempo). Each control posts a bridge envelope to its C# slice. */
    .toolbar {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .5rem 1rem;
      background: #2d2d30;
      border-bottom: 1px solid #333;
      font-size: .85rem;
      flex-wrap: wrap;
    }
    .toolbar label { color: #9aa0a6; }
    .toolbar select,
    .toolbar input {
      font: inherit;
      padding: .25rem .4rem;
      background: #3a3a3d;
      color: #e6e6e6;
      border: 1px solid #4a4a4f;
      border-radius: 4px;
    }
    #tempo { width: 4rem; }
    .toolbar button {
      font: inherit;
      padding: .3rem .9rem;
      border: 1px solid #4a4a4f;
      border-radius: 4px;
      background: #3a3a3d;
      color: #e6e6e6;
      cursor: pointer;
    }
    .toolbar button:disabled { opacity: .5; cursor: default; }

    main { display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
    #score-pane { flex: 1; min-width: 0; }
    /* alphaTab renders its tablature into #score. position:relative anchors the
       absolutely-positioned cursor overlay. */
    #score { position: relative; background: #fff; color: #000; border-radius: 6px; overflow: auto; }
    /* alphaTab positions the playback cursor + highlight elements but does NOT
       color them — we must, per the alphaTab cursor docs, or they're invisible. */
    .at-cursor-bar { background: rgba(255, 242, 0, 0.25); }      /* current bar highlight */
    .at-cursor-beat { background: rgba(64, 64, 255, 0.75); width: 3px; } /* moving beat line */
    .at-highlight * { fill: #2867f5; stroke: #2867f5; }          /* active beat's notes */

    /* Saved-exercise library — click an item to reload it. */
    #library-pane {
      width: 240px;
      flex: none;
      background: #252526;
      border: 1px solid #333;
      border-radius: 6px;
      padding: .5rem;
    }
    #library-pane h2 { font-size: .85rem; margin: .2rem .3rem .5rem; color: #9aa0a6; font-weight: 600; }
    #library { list-style: none; margin: 0; padding: 0; max-height: 64vh; overflow: auto; }
    #library li { padding: .4rem .5rem; border-radius: 4px; cursor: pointer; font-size: .82rem; }
    #library li:hover { background: #2d2d30; }
    #library li.empty { color: #6b7075; cursor: default; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>ChordFlow</h1>
    <span>Rhythm &amp; Progression Trainer</span>
    <span id="status">starting…</span>
  </header>

  <!-- Builder: pick key + rhythm, then generate / save / mark practiced. -->
  <section class="toolbar" id="builder">
    <label for="key">Key</label>
    <select id="key"></select>
    <label for="rhythm">Rhythm</label>
    <select id="rhythm"></select>
    <button id="btnGenerate" type="button">Generate</button>
    <button id="btnSave" type="button">Save</button>
    <button id="btnPractice" type="button">Mark practiced</button>
  </section>

  <!-- Transport: play/stop/tempo for the score on screen. -->
  <section class="toolbar" id="transport">
    <button id="btnPlay" type="button" disabled>▶ Play</button>
    <button id="btnStop" type="button" disabled>■ Stop</button>
    <label for="tempo">Tempo</label>
    <input id="tempo" type="number" min="40" max="240" step="1" value="80" disabled />
    <span>BPM</span>
  </section>

  <main>
    <div id="score-pane"><div id="score"></div></div>
    <aside id="library-pane">
      <h2>Saved exercises</h2>
      <ul id="library"><li class="empty">No saved exercises</li></ul>
    </aside>
  </main>

  <!-- Bundled alphaTab JS build (constraint C6) — loaded from disk, offline. -->
  <script src="alphaTab.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
